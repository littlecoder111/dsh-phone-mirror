name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: npm run check
      - name: Validate manifests and locales
        run: |
          node -e "for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
